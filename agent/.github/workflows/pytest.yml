name: pytest

# Runs the unit-test suite on every push / PR against main and gates
# on the coverage floor declared in pytest.ini (--cov-fail-under=80).
#
# Background: pytest.ini has long declared the 80% floor, but until this
# workflow shipped no CI ran pytest at all — the .coverage file checked
# in to the repo predated the entire wire-rewrite (March 2026 vs the
# agent-rewrite-c cutover late April 2026). This workflow re-establishes
# the gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-full.txt
            requirements-core.txt

      - name: Install dependencies
        # requirements-dev.txt already pulls in requirements-full.txt and
        # then layers pytest / pytest-cov / pytest-mock / pytest-asyncio /
        # moto / freezegun / responses on top. No ad-hoc pins needed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage gate
        # pytest.ini sets --cov=src --cov-fail-under=80 in addopts, so
        # the bare `pytest` invocation below already enforces the gate.
        # We pass the flags explicitly anyway so a future addopts edit
        # can't silently weaken CI.
        run: |
          python -m pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14
