{{/*
  Only rendered when the user provides inline credentials AND didn't point
  to an existing Secret. In production, always use auth.existingSecret.
*/}}
{{- if and (not .Values.auth.existingSecret) (or .Values.auth.inline.apiKey .Values.auth.inline.tenantId) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpu-agent.authSecretName" . }}
  labels:
    {{- include "gpu-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeys.apiKey }}: {{ required "auth.inline.apiKey or auth.existingSecret must be set" .Values.auth.inline.apiKey | quote }}
  {{ .Values.auth.secretKeys.tenantId }}: {{ required "auth.inline.tenantId or auth.existingSecret must be set" .Values.auth.inline.tenantId | quote }}
  {{- if or (eq .Values.commMode "grpc") (eq .Values.commMode "both") }}
  {{ .Values.auth.secretKeys.keyId }}: {{ required "auth.inline.keyId required for gRPC commMode" .Values.auth.inline.keyId | quote }}
  {{ .Values.auth.secretKeys.hmacPepper }}: {{ required "auth.inline.hmacPepper required for gRPC commMode" .Values.auth.inline.hmacPepper | quote }}
  {{ .Values.auth.secretKeys.hostname }}: {{ required "auth.inline.hostname required for gRPC commMode" .Values.auth.inline.hostname | quote }}
  {{- end }}
{{- end }}
