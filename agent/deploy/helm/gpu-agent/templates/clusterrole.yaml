{{/*
  Only rendered when the Kubernetes monitor is enabled in in-cluster mode.
  Grants read access to pods, nodes, and GPU-related resources.
*/}}
{{- if and .Values.monitors.kubernetes.enabled .Values.monitors.kubernetes.inCluster }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-agent.fullname" . }}-reader
  labels:
    {{- include "gpu-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpu-agent.fullname" . }}-reader
  labels:
    {{- include "gpu-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "gpu-agent.fullname" . }}-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
