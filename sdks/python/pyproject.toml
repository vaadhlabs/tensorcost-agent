[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensorcost"
version = "1.3.1"
description = "One-line wrapper SDK for TensorCost — LLM observability and control-layer inference routing for OpenAI, Anthropic, Bedrock, and Vertex clients."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vaadh Labs / TensorCost", email = "engineering@tensorcost.com" },
]
keywords = ["llm", "openai", "anthropic", "observability", "cost", "tensorcost"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.urls]
Homepage = "https://tensorcost.com"
Documentation = "https://docs.tensorcost.com"
Source = "https://github.com/vaadhlabs/tensorcost-agent/tree/main/sdks/python"
Changelog = "https://github.com/vaadhlabs/tensorcost-agent/blob/main/sdks/python/CHANGELOG.md"
"Bug Tracker" = "https://github.com/vaadhlabs/tensorcost-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorcost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
