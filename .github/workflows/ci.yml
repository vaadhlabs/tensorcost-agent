name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0a5c615913736394b2f866a58fbc4dfa1334b659
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements-export.txt
      - name: Pytest
        run: pytest --cov=src --cov=main --cov-report=term --cov-fail-under=77

  sdk-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d50c2d111c1985d56786760d276a
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  sdk-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0a5c615913736394b2f866a58fbc4dfa1334b659
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest

  proto-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify agent.proto matches published copy
        run: |
          test -f docs/proto/agent.proto
          test -f agent/src/proto/agent.proto
          diff -u agent/src/proto/agent.proto docs/proto/agent.proto
